 Cuenca! Soy el profesor Aguilar, su mentor académico. Hoy abrimos las puertas del Bloque 1: Materia y Energía en el organismo humano. A menudo se preguntan: "¿Por qué un médico debe estudiar química?". La respuesta es contundente: la medicina moderna no es más que la química aplicada al mantenimiento de la vida.`,emphasis:`la medicina moderna no es más que la química aplicada al mantenimiento de la vida`,actionNote:`Acomoda su bata blanca y mira fijamente a la cámara con convicción docente.`,timestampStart:0,duration:22},{id:`b1-s1-seg2`,speaker:`Aquila`,text:`Debemos diferenciar dos grandes vertientes: la Química Pura busca comprender leyes universales y mecanismos moleculares sin un fin utilitario inmediato. En cambio, la Química Aplicada a la Medicina toma ese conocimiento y lo transforma en herramientas diagnósticas, terapéuticas y farmacológicas. Cuando solicitan una glucemia, ionograma o gasometría arterial, están interpretando principios químicos aplicados.`,emphasis:`Química Aplicada a la Medicina: diagnóstico, terapéutica y farmacología`,actionNote:`Despliega con su puntero láser un panel comparativo de pruebas clínicas.`,timestampStart:23,duration:25},{id:`b1-s1-seg3`,speaker:`Aquila`,text:`Nuestra cátedra se sostiene sobre cuatro pilares: 1) Fisiología Celular: cada célula es un biorreactor con miles de reacciones enzimáticas simultáneas. 2) Farmacología: diseño de moléculas que modulan receptores diana. 3) Prevención e Higiene: desde el agua potable hasta antisépticos y vacunas. Y 4) Genética Molecular: decodificación del ADN y terapia génica. ¡Sin química, la medicina retrocedería al empirismo!`,emphasis:`Cuatro Pilares: Fisiología, Farmacología, Prevención y Genética Molecular`,actionNote:`Enfoca cada pilar holográfico en la simulación interactiva.`,timestampStart:49,duration:25}],keyFormulas:[`Química Pura: Estructura atómica, enlaces y leyes universales teóricas`,`Química Médica: Homeostasis celular, biomarcadores y terapéutica molecular`,`Pilar 1: Fisiología Celular (Biorreactores enzimáticos)`,`Pilar 2: Farmacología Molecular (Receptores y ligandos)`,`Pilar 3: Prevención e Higiene (Asepsia y antisepsia)`,`Pilar 4: Genética Molecular (Ácidos nucleicos y terapia génica)`],tableData:{headers:[`Pilar Fundamental`,`Nivel Químico`,`Aplicación Médica Clínica Directa`],rows:[[`Fisiología Celular`,`Metabolismo, Enzimas, ATP`,`Homeostasis hídrica, contracción muscular y conducción`],[`Farmacología`,`Química de Receptores y Enlaces`,`Diseño de fármacos, inhibición enzimática y quimioterapia`],[`Prevención e Higiene`,`Antisepsia, Desinfección, Agua`,`Esterilización quirúrgica, cloración y vacunas profilácticas`],[`Genética Molecular`,`Estructura de Ácidos Nucleicos`,`Pruebas de PCR, diagnóstico prenatal y terapia génica`]]},keyPoints:[`Diferencia fundamental: pura (teórica/universal) vs aplicada (diagnóstico, terapéutica y prevención clínica).`,`Cada célula eucariota es un reactor químico abierto en continuo intercambio con el medio interno.`,`Los análisis de laboratorio más comunes (ionograma, gasometría, glucemia) son determinaciones fisicoquímicas.`,`Interrelación estricta entre estructura química molecular y función fisiológica humana.`],simulationType:`pure-vs-applied-chemistry`},{id:2,title:`1.2. Materia, Energía y Nutrición Celular (Bioenergética)`,subtitle:`Valores Calóricos de Macromoléculas, ATP y Leyes Termodinámicas`,timeRangeFormatted:`03:30 - 07:00`,startSeconds:210,durationSeconds:210,cameraShot:`Plano General - Centro de Bioenergética Metabólica UCACUE`,actionDescription:`Aquila camina junto a un ergómetro y una pantalla 3D que muestra la molécula de ATP hidrolizándose en ADP y fosfato inorgánico.`,speechSegments:[{id:`b1-s2-seg1`,speaker:`Aquila`,text:`El cuerpo humano es un sistema termodinámico abierto: intercambiamos continuamente materia y energía con el entorno. Para mantener el orden molecular interno y contrarrestar la entropía, requerimos un suministro ininterrumpido de energía metabólica.`,emphasis:`Sistema termodinámico abierto en flujo continuo`,actionNote:`Gira un modelo 3D de la molécula de ATP señalando sus enlaces fosfoanhídrido.`,timestampStart:0,duration:18},{id:`b1-s2-seg2`,speaker:`Aquila`,text:`Distinguimos dos formas primordiales: Energía Potencial Química, almacenada en los enlaces covalentes de carbohidratos, triglicéridos y en el ATP; y Energía Cinética, manifestada en el trabajo muscular cardíaco, transporte activo y disipación de calor.`,emphasis:`Energía Potencial en enlaces covalentes vs Energía Cinética muscular y térmica`,actionNote:`Señala los datos cuantitativos en la pantalla calórica.`,timestampStart:19,duration:20},{id:`b1-s2-seg3`,speaker:`Aquila`,text:`¡Memoricen los valores calóricos para sus cálculos nutricionales! Carbohidratos: 4 kcal por gramo (17 kJ/g). Proteínas: 4 kcal por gramo (17 kJ/g). Y lípidos: 9 kcal por gramo (38 kJ/g), la reserva más densa. Recuerden que una kilocaloría equivale exactamente a 4,184 kilojulios.`,emphasis:`4 kcal/g en glúcidos y proteínas; 9 kcal/g en lípidos (1 kcal = 4,184 kJ)`,actionNote:`Muestra la resolución paso a paso del paciente en recuperación nutricional.`,timestampStart:40,duration:25}],keyFormulas:[`1 kcal = 1.000 cal = 4,184 kJ = 4.184 J`,`Carbohidratos: 4 kcal/g (17 kJ/g) → Energía inmediata`,`Proteínas: 4 kcal/g (17 kJ/g) → Estructural, enzimática e inmune`,`Lípidos: 9 kcal/g (38 kJ/g) → Reserva energética densa y aislante`,`ATP + H₂O ⇄ ADP + Pi + Energía Libre (ΔG° = -30,5 kJ/mol / -7,3 kcal/mol)`],tableData:{headers:[`Macronutriente`,`Densidad (kcal/g)`,`Densidad (kJ/g)`,`Función Biológica Principal`],rows:[[`Carbohidratos`,`4 kcal/g`,`17 kJ/g`,`Combustible metabólico primario inmediato`],[`Proteínas`,`4 kcal/g`,`17 kJ/g`,`Estructural, catalizadores enzimáticos y defensa inmunitaria`],[`Lípidos / Grasas`,`9 kcal/g`,`38 kJ/g`,`Reserva energética anhidra concentrada y bicapa celular`]]},keyPoints:[`El cuerpo humano es un sistema termodinámico abierto en estado estacionario dinámico.`,`La hidrólisis de ATP impulsa el transporte activo (como la bomba Na+/K+ ATPasa) y la contracción sarcomérica.`,`Conversión universal: 1 kcal = 4,184 kJ. Medido experimentalmente en bomba calorimétrica.`,`Cálculo clínico resuelto: 65 g glúcidos + 20 g proteínas + 15 g lípidos = 475 kcal = 1.987,4 kJ.`],simulationType:`bioenergetics-nutrition`},{id:3,title:`1.3. Enlace Químico y Naturaleza de las Interacciones`,subtitle:`Enlace Iónico vs Covalente: Formación de Electrolitos y Conducción Nerviosa`,timeRangeFormatted:`07:00 - 10:30`,startSeconds:420,durationSeconds:210,cameraShot:`Plano Medio - Laboratorio de Química Estructural UCACUE`,actionDescription:`Aquila sostiene en una mano una red cristalina tridimensional de NaCl y en la otra un modelo covalente de glucosa, demostrando la disociación iónica en agua.`,speechSegments:[{id:`b1-s3-seg1`,speaker:`Aquila`,text:`Las propiedades de los fluidos de nuestros pacientes están gobernadas por el tipo de enlace que une a sus átomos. La fuerza intramolecular que mantiene cohesionados a los elementos es el enlace químico, y en medicina nos enfocamos en dos grandes clases.`,emphasis:`El enlace químico determina la solubilidad y reactividad biológica`,actionNote:`Sostiene un electrodo de conductividad y una red cristalina de NaCl.`,timestampStart:0,duration:18},{id:`b1-s3-seg2`,speaker:`Aquila`,text:`El Enlace Iónico ocurre por transferencia neta de electrones entre un metal electropositivo y un no metal electronegativo. En estado sólido forman cristales rígidos, pero al disolverse en el agua corporal se disocian totalmente en iones libres o electrolitos: sodio, potasio, calcio y cloruro, indispensables para el potencial de acción neuronal y la sístole cardíaca.`,emphasis:`Enlace iónico: transferencia de e⁻ y disociación en electrolitos fisiológicos`,actionNote:`Sumerge la sal en agua y muestra el encendido de un circuito de conductividad eléctrica.`,timestampStart:19,duration:25},{id:`b1-s3-seg3`,speaker:`Aquila`,text:`Por otro lado, el Enlace Covalente se forma por compartición de pares de electrones entre no metales. Puede ser simple como en el enlace carbono-hidrógeno, doble como en el oxígeno molecular O₂, o triple como en el nitrógeno atmosférico N₂. La diferencia de electronegatividad genera enlaces covalentes polares, como en el agua, cuna de la vida.`,emphasis:`Enlace covalente: compartición de electrones (simple, doble, triple y polar)`,actionNote:`Señala los orbitales compartidos y la densidad electrónica en pantalla.`,timestampStart:45,duration:24}],keyFormulas:[`Enlace Iónico: ΔEN ≥ 1,7 → Transferencia de e⁻ (Formación de red y electrolitos)`,`NaCl(s) + H₂O → Na⁺(ac) + Cl⁻(ac) (Disociación electrolítica completa)`,`Enlace Covalente Polar: 0,4 < ΔEN < 1,7 (Momentos dipolares y puentes de H)`,`Enlace Covalente Apolar: ΔEN ≤ 0,4 (Cadenas hidrocarbonadas hidrofóbicas)`,`Orden de enlace: Simple (1 par e⁻), Doble (2 pares e⁻), Triple (3 pares e⁻)`],tableData:{headers:[`Tipo de Enlace`,`Mecanismo Electrónico`,`Comportamiento en Agua`,`Relevancia Fisiomédica`],rows:[[`Iónico (NaCl, KCl)`,`Transferencia de electrones`,`Disociación en electrolitos`,`Potenciales de membrana, contracción y osmolaridad`],[`Covalente Polar (Glucosa, H₂O)`,`Compartición asimétrica`,`Soluble sin formar iones`,`Transporte plasmático de nutrientes e hidratación`],[`Covalente No Polar (Lípidos, O₂)`,`Compartición simétrica`,`Insoluble / Requiere transportador`,`Bicapa lipídica y difusión de gases respiratorios`]]},keyPoints:[`Los electrolitos son solutos iónicos disociados capaces de conducir corriente eléctrica en solución acuosa.`,`Los cationes principales son Na⁺ (extracelular) y K⁺ (intracelular); aniones principales Cl⁻ y HCO₃⁻.`,`Los enlaces covalentes confieren estabilidad estructural a proteínas, ácidos nucleicos y glúcidos.`,`La polaridad molecular condiciona el paso transmembranal y la farmacocinética de medicamentos.`],simulationType:`chemical-bonds-electrolytes`},{id:4,title:`1.4. Funciones Inorgánicas en la Práctica Clínica`,subtitle:`Compuestos Binarios, Ternarios y Cuaternarios en Farmacología y Terapéutica`,timeRangeFormatted:`10:30 - 14:00`,startSeconds:630,durationSeconds:210,cameraShot:`Plano General - Farmacia Hospitalaria y Pizarra de Nomenclatura`,actionDescription:`Aquila organiza frascos hospitalarios y clasifica compuestos inorgánicos esenciales: suero salino, ácido clorhídrico gástrico, leche de magnesia y bicarbonato de sodio.`,speechSegments:[{id:`b1-s4-seg1`,speaker:`Aquila`,text:`En el hospital y en urgencias manipulamos compuestos inorgánicos en cada turno. Clasifiquémoslos rigurosamente por su número de elementos: binarios, ternarios y cuaternarios.`,emphasis:`Clasificación estricta: binarios (2), ternarios (3) y cuaternarios (4 elementos)`,actionNote:`Señala las tres estanterías farmacológicas en el laboratorio virtual.`,timestampStart:0,duration:15},{id:`b1-s4-seg2`,speaker:`Aquila`,text:`Entre los Binarios destacan: el dióxido de carbono CO₂, óxido ácido producto del catabolismo celular y principal estímulo del centro respiratorio; el ácido clorhídrico HCl, hidrácido gástrico que mantiene el pH entre 1,5 y 2,0; y el cloruro de sodio NaCl, base del Suero Fisiológico al 0,9% para reposición de volemia.`,emphasis:`Binarios: CO₂ regulador respiratorio, HCl gástrico bactericida y NaCl al 0,9%`,actionNote:`Muestra una bolsa de infusión de cloruro de sodio y un esquema gástrico.`,timestampStart:16,duration:24},{id:`b1-s4-seg3`,speaker:`Aquila`,text:`En los Ternarios tenemos el hidróxido de magnesio Mg(OH)₂ o Leche de Magnesia como antiácido y laxante osmótico, y el ácido carbónico H₂CO₃. Y en los Cuaternarios: ¡el bicarbonato de sodio NaHCO₃! Sal ácida administrada en emergencias de acidosis metabólica e hiperpotasemia, junto con los tampones fosfato intracelulares.`,emphasis:`Ternarios: Mg(OH)₂; Cuaternarios: Bicarbonato de Sodio NaHCO₃ en emergencias`,actionNote:`Enfoca la ampolla de bicarbonato al 8,4% para reanimación.`,timestampStart:41,duration:25}],keyFormulas:[`Binarios: CO₂ (Anhídrido/Óxido ácido), HCl (Hidrácido gástrico), NaCl (Sal binaria al 0,9%)`,`Ternarios: Mg(OH)₂ (Hidróxido antiácido), H₂CO₃ (Oxácido carbónico), CaSO₄ (Yeso quirúrgico)`,`Cuaternarios: NaHCO₃ (Sal ácida - Bicarbonato de sodio vital en shock acidótico)`,`Tampón Fosfato Cuaternario: Na₂HPO₄ / NaH₂PO₄ (Amortiguador intracelular y tubular renal)`],tableData:{headers:[`Tipo Compuesto`,`Fórmula`,`Nomenclatura Química`,`Función Clínica Aplicada`],rows:[[`Binario (Hidrácido)`,`HCl(ac)`,`Ácido clorhídrico`,`Digestión gástrica, activación de pepsina y barrera bactericida`],[`Binario (Sal neutra)`,`NaCl`,`Cloruro de sodio`,`Suero fisiológico al 0,9% (154 mEq/L Na⁺ y Cl⁻) para volemia`],[`Ternario (Hidróxido)`,`Mg(OH)₂`,`Hidróxido de magnesio`,`Antiácido gástrico y laxante osmótico no absorbible`],[`Ternario (Oxisal)`,`CaSO₄·½H₂O`,`Sulfato de calcio hemihidratado`,`Yeso médico para inmovilización ortopédica de fracturas`],[`Cuaternario (Sal ácida)`,`NaHCO₃`,`Bicarbonato de sodio`,`Tratamiento de acidosis metabólica y alcalinización urinaria`]]},keyPoints:[`Compuestos binarios contienen 2 elementos; ternarios 3 elementos; cuaternarios 4 elementos.`,`El suero salino isotónico (0,9% m/v) aporta 154 mEq/L de Na⁺ y 154 mEq/L de Cl⁻ con osmolaridad de 308 mOsm/L.`,`El NaHCO₃ es una sal ácida cuaternaria (Na, H, C, O) indispensable en reanimación cardiopulmonar.`,`Los fosfatos mono y disódicos son sales cuaternarias que amortiguan la carga ácida en los túbulos renales.`],simulationType:`inorganic-functions-clinical`},{id:5,title:`1.5. Fisicoquímica del Agua, Soluciones y Tonicidad`,subtitle:`Puentes de Hidrógeno, Cristaloides vs Coloides y Osmolaridad Eritrocitaria`,timeRangeFormatted:`14:00 - 18:00`,startSeconds:840,durationSeconds:240,cameraShot:`Plano Medio - Gabinete de Fisiología Celular y Hematología UCACUE`,actionDescription:`Aquila ajusta un microscopio virtual con transmisión en vivo donde se observan glóbulos rojos sometidos a soluciones isotónicas, hipotónicas y de alta tonicidad.`,speechSegments:[{id:`b1-s5-seg1`,speaker:`Aquila`,text:`El agua representa entre el 60% y 70% del peso corporal de un adulto. Su molécula posee una geometría angular de 104,5 grados. Gracias a la alta electronegatividad del oxígeno frente al hidrógeno, se crea un dipolo permanente capaz de formar hasta 4 puentes de hidrógeno simultáneos.`,emphasis:`Geometría angular de 104,5° y red de 4 puentes de hidrógeno`,actionNote:`Muestra la animación 3D de la molécula de agua y sus puentes dinámicos.`,timestampStart:0,duration:20},{id:`b1-s5-seg2`,speaker:`Aquila`,text:`Esto le confiere propiedades anómalas indispensables: alto calor específico (1 cal/g·°C) para evitar cambios bruscos de temperatura corporal; alto calor de vaporización (540 cal/g) para disipar calor con el sudor; y alta constante dieléctrica (78,5) para solvatar y disolver electrolitos en esferas de hidratación.`,emphasis:`Propiedades anómalas: calor específico, calor de vaporización y constante dieléctrica`,actionNote:`Enfoca la esfera de hidratación rodeando a iones de sodio y cloruro.`,timestampStart:21,duration:22},{id:`b1-s5-seg3`,speaker:`Aquila`,text:`¡Atención médica a la tonicidad! Si colocan eritrocitos en una solución isotónica (280 a 295 mOsm/kg), conservan su disco bicóncavo. En una solución hipotónica menor a 280 mOsm/kg, el agua entra por ósmosis provocando hinchamiento y lisis o hemólisis. En cambio, en una solución hipertónica superior a 295 mOsm/kg, el agua escapa al exterior causando crenación celular.`,emphasis:`Isotónico: equilibrio; Hipotónico (<280): hemólisis; Hipertónico (>295): crenación`,actionNote:`Muestra en el microscopio la lisis explosiva y la retracción por crenación.`,timestampStart:44,duration:28}],keyFormulas:[`Geometría molecular: Angular (104,5°) • Dipolo permanente (μ = 1,85 D)`,`Calor específico: 1,00 cal/g·°C • Calor de vaporización: 540 cal/g a 100°C`,`Molaridad (M) = moles soluto (n) / Volumen solución (L) = (m / MM) / V(L)`,`Normalidad (N) = equivalentes soluto / V(L) = Molaridad × feq`,`Osmolaridad plasmática normal: 280 - 295 mOsm/kg H₂O`,`Tonicidad: Isotónica (~285-300 mOsm/L) • Hipotónica (<280 mOsm/L) • Hipertónica (>300 mOsm/L)`],tableData:{headers:[`Tipo de Solución`,`Osmolaridad Relativa`,`Movimiento Neto de Agua`,`Efecto Morfológico Eritrocito`],rows:[[`Isotónica (NaCl 0,9%)`,`280 - 295 mOsm/kg`,`Flujo de entrada = Flujo de salida`,`Disco bicóncavo intacto y funcional`],[`Hipotónica (Agua destilada / NaCl 0,45%)`,`< 280 mOsm/kg`,`Entrada masiva de H₂O hacia el interior`,`Edema celular, turgencia y Lisis (Hemólisis)`],[`Hipertónica (NaCl 2,0% / Dextrosa 10%)`,`> 295 mOsm/kg`,`Salida de H₂O hacia el medio extracelular`,`Deshidratación celular, arrugamiento y Crenación`]]},keyPoints:[`Cristaloides (baja masa molecular, atraviesan capilares) vs Coloides (albúmina, ejercen presión oncótica).`,`La hemólisis masiva por infusión errónea de agua libre intravascular libera hemoglobina nefrotóxica.`,`Cálculo resuelto: 11,7 g NaCl en 500 mL → n = 0,20 mol; V = 0,5 L → M = 0,40 M; N = 0,40 N (feq=1).`,`El endotelio capilar normal retiene coloides proteicos manteniendo la volemia eficaz circulante.`],simulationType:`water-solutions-tonicity`},{id:6,title:`1.6. pH, Amortiguadores y Equilibrio Ácido-Básico`,subtitle:`Ecuación de Henderson-Hasselbalch, Tampón Bicarbonato y Compensación en Cetoacidosis`,timeRangeFormatted:`18:00 - 21:30`,startSeconds:1080,durationSeconds:210,cameraShot:`Plano Medio - UCI y Monitor Gasométrico en Tiempo Real`,actionDescription:`Aquila examina el monitor de signos vitales y gasometría de un paciente admitido con cetoacidosis diabética, deduciendo los parámetros con Henderson-Hasselbalch.`,speechSegments:[{id:`b1-s6-seg1`,speaker:`Aquila`,text:`El mantenimiento del pH arterial en el rango fisiológico estricto de 7,35 a 7,45 es una condición innegociable para la vida. Por debajo de 7,35 estamos ante una acidosis, que deprime el sistema nervioso central y disminuye la contractilidad miocárdica; por encima de 7,45 hay alcalosis, con tetania, arritmias y convulsiones.`,emphasis:`Rango arterial estricto: 7,35 a 7,45 (Acidosis < 7,35 / Alcalosis > 7,45)`,actionNote:`Muestra la escala de pH logarítmica y los riesgos vitales de cada extremo.`,timestampStart:0,duration:22},{id:`b1-s6-seg2`,speaker:`Aquila`,text:`La ecuación cumbre de la medicina clínica es la de Henderson-Hasselbalch: pH es igual a pKa más el logaritmo del bicarbonato sobre 0,03 por la presión parcial de CO₂. El bicarbonato, de 24 mEq/L, es el componente metabólico regulado por los riñones. La pCO₂, de 40 mmHg, es el componente respiratorio regulado rápidamente por los pulmones.`,emphasis:`pH = 6,1 + log([HCO₃⁻] / [0,03 × pCO₂]) — Eje Bicarbonato Renal / CO₂ Pulmonar`,actionNote:`Desglosa los términos matemáticos en el monitor gasométrico interactivo.`,timestampStart:23,duration:25},{id:`b1-s6-seg3`,speaker:`Aquila`,text:`Analicemos nuestro caso clínico: varón de 45 años con diabetes tipo 1 que ingresa con taquipnea profunda de Kussmaul. Su gasometría arroja pH de 7,18, pCO₂ de 28 mmHg y bicarbonato de 10 mEq/L. Diagnóstico: Acidosis metabólica severa por consumo de bicarbonato, con compensación respiratoria parcial por hiperventilación.`,emphasis:`Caso clínico: Acidosis metabólica con taquipnea de Kussmaul compensatoria`,actionNote:`Comprueba el cálculo matemático con resultado exacto de pH 7,18.`,timestampStart:49,duration:26}],keyFormulas:[`pH = -log₁₀[H⁺] • [H⁺] fisiológico = 40 nmol/L (40 × 10⁻⁹ M)`,`Ecuación de Henderson-Hasselbalch: pH = 6,1 + log₁₀([HCO₃⁻] / [0,03 · pCO₂])`,`[HCO₃⁻] normal = 24 mEq/L (Rango: 22 - 26 mEq/L) — Componente Metabólico Renal`,`pCO₂ normal = 40 mmHg (Rango: 35 - 45 mmHg) — Componente Respiratorio Pulmonar`,`Caso Clínico: pH = 6,1 + log(10 / [0,03 × 28]) = 6,1 + log(11,90) = 6,1 + 1,075 = 7,18`],tableData:{headers:[`Parámetro Gasométrico`,`Valor del Paciente`,`Rango Fisiológico`,`Interpretación Fisiopatológica`],rows:[[`pH Arterial`,`7,18`,`7,35 - 7,45`,`Acidemia severa (peligro inminente de colapso)`],[`Bicarbonato [HCO₃⁻]`,`10 mEq/L`,`22 - 26 mEq/L`,`Consumo primario masivo por amortiguación de cetoácidos`],[`pCO₂ Arterial`,`28 mmHg`,`35 - 45 mmHg`,`Hipocapnia por hiperventilación de Kussmaul (compensación)`],[`Diagnóstico Integrado`,`Acidosis Metabólica Severa`,`Homeostasis intacta`,`Compensada parcialmente por el sistema respiratorio`]]},keyPoints:[`El sistema amortiguador bicarbonato/ácido carbónico es el más importante del líquido extracelular.`,`Los pulmones responden en minutos modificando la ventilación alveolar para barrer o retener CO₂.`,`Los riñones tardan horas a días en reabsorber o secretar nuevo bicarbonato y protones.`,`La respiración de Kussmaul es un signo clínico clave de hiperventilación compensatoria ante acidemias.`],simulationType:`ph-henderson-hasselbalch`},{id:7,title:`1.7. Desafío Clínico y Autoevaluación Integral Bloque 1`,subtitle:`Evaluación Formativa Acumulativa con Retroalimentación Médica Inmediata`,timeRangeFormatted:`21:30 - 24:00`,startSeconds:1290,durationSeconds:150,cameraShot:`Plano Medio - Pizarra Digital Evaluativa y Mesa de Trabajo`,actionDescription:`Aquila reta a los estudiantes con tres preguntas oficiales del Sílabo: respuesta compensatoria en cetoacidosis, crenación eritrocitaria en NaCl al 2% y cálculo molar de bicarbonato.`,speechSegments:[{id:`b1-s7-seg1`,speaker:`Aquila`,text:`¡Extraordinario recorrido por el Bloque 1, colegas! Han integrado la química pura con la clínica médica real: bioenergética, enlaces, electrolitos, soluciones, tonicidad y equilibrio ácido-base. Ahora pondremos a prueba su juicio clínico con el reto acumulativo del Sílabo.`,emphasis:`Pongan a prueba su juicio clínico con el reto acumulativo del Bloque 1`,actionNote:`Activa el cuestionario interactivo en la pantalla digital.`,timestampStart:0,duration:18},{id:`b1-s7-seg2`,speaker:`Aquila`,text:`Resuelvan cada escenario en el panel interactivo. Analicen la hiperventilación en cetoacidosis, el comportamiento del glóbulo rojo en medios hipertónicos y la preparación estequiométrica del bicarbonato. ¡Demuestren que #SomosÁguilasRojas con excelencia médica!`,emphasis:`Excelencia médica y juicio clínico en cada decisión farmacológica`,actionNote:`Invita a interactuar con los botones de opción múltiple con retroalimentación.`,timestampStart:19,duration:20}],keyFormulas:[`Pregunta 1: Cetoacidosis → Hiperventilación inmediata para descender pCO₂ y elevar pH`,`Pregunta 2: NaCl al 2,0% (>295 mOsm/kg) → Medio hipertónico → Salida de H₂O → Crenación celular`,`Pregunta 3: 42,0 g NaHCO₃ (MM = 84 g/mol) en 1.000 mL → n = 0,50 mol → M = 0,50 M`],keyPoints:[`Verificación inmediata de competencias antes de pasar al Bloque 2 (Leyes de los Gases y Medicina).`,`Correlación directa con las prácticas de laboratorio 1 a 5 del sílabo oficial de la UCACUE.`,`Manejo seguro de soluciones parenterales y reconocimiento oportuno de emergencias metabólicas.`],simulationType:`block1-clinical-challenge`}]},{id:`bloque-2-gases-medicina`,blockNumber:2,dates:`19-10-2026 al 10-11-2026`,title:`Bloque 2: Gases y su Aplicación en Medicina`,shortTitle:`Bloque 2: Gases & Medicina`,badge:`Bloque 2 (19-10 al 10-11)`,category:`Físico-Química de Gases y Fisiología Respiratoria`,academicLevel:`Primer Ciclo de Medicina y Ciencias de la Salud • Código MBAS04`,presenter:`Profesor Aguilar (Mascota Universitaria)`,presenterDesc:`Águila antropomórfica con bata médica blanca, sudadera roja universitaria, gafas de protección y puntero láser.`,scenery:`Aula Magna y Laboratorio de Fisiología Pulmonar UCACUE`,totalDurationFormatted:`24:00 min`,practicalLabs:[`Práctica 6: Los gases y las soluciones ácido-básicas (2 pts)`],evaluations:[`Proyectos de aula de aplicación de gases (7 pts)`,`Prueba objetiva Bloque 2 (5 pts)`,`Examen Interciclo (10 pts)`],supportDocuments:[`QUÍMICA LEYES DE LOS GASES SEPTIEMBRE 2026 - FEBRERO 2027.pdf`],scenes:[{id:1,title:`Módulo 2.1: Características y Propiedades de los Gases`,subtitle:`Teoría Cinético-Molecular, Barómetro de Torricelli y Variables de Estado`,timeRangeFormatted:`00:00 - 03:30`,startSeconds:0,durationSeconds:210,cameraShot:`[PLANO MEDIO] Laboratorio de Físico-Química y Barometría`,actionDescription:`El Profesor Aguilar ajusta sus gafas de protección, se acerca a la pantalla holográfica y saluda a los estudiantes con voz firme y clara.`,speechSegments:[{id:`2-1-1`,speaker:`PROF. AGUILAR`,text:`¡Bienvenidos al Bloque 2, futuros médicos! Soy el profesor Aguilar. Hoy entraremos al fascinante mundo de la fisicoquímica de los gases. A diferencia de los sólidos y líquidos, cuyas partículas están confinadas por intensas fuerzas de atracción, un gas no posee forma ni volumen definidos, extendiéndose hasta ocupar todo el espacio del recipiente que lo contiene.`,actionNote:`Ajusta sus gafas de protección y saluda con porte académico.`,timestampStart:0,duration:22},{id:`2-1-2`,speaker:`AQUILA`,text:`Debido a que existe una gran distancia entre sus moléculas, los gases presentan una baja densidad y una elevada compresibilidad. Para modelar este comportamiento cuantitativamente, la fisicoquímica utiliza la Teoría Cinético-Molecular de los Gases Ideales, la cual se fundamenta en cinco postulados rigurosos.`,actionNote:`Señala hacia la cámara de partículas interactiva.`,timestampStart:22,duration:21},{id:`2-1-3`,speaker:`AQUILA`,text:`Primero: Movimiento caótico y rectilíneo constante. Segundo: Fuerzas intermoleculares nulas. Tercero: Volumen molecular despreciable frente al espacio total. Cuarto: Energía cinética proporcional a la temperatura Kelvin. Y Quinto: Colisiones perfectamente elásticas que generan la presión al transferir momento contra las paredes.`,actionNote:`Enumera en la pizarra los cinco postulados.`,timestampStart:43,duration:25},{id:`2-1-4`,speaker:`AQUILA`,text:`Para definir el estado termodinámico requerimos Presión, Volumen, Temperatura y Cantidad de sustancia. A nivel del mar, Evangelista Torricelli demostró que la atmósfera sostiene una columna de mercurio de 760 milímetros de mercurio, equivalentes a una atmósfera.`,actionNote:`Muestra el barómetro de Torricelli comparando altitud de Cuenca vs. nivel del mar.`,timestampStart:68,duration:20}],tableData:{headers:[`Unidad de Presión`,`Abreviatura`,`Equivalencia a 1 atm`,`Aplicación Médica / Hospitalaria`],rows:[[`Atmósfera`,`atm`,`1,0 atm`,`Estándar de calibración barométrica`],[`Milímetros de Mercurio`,`mmHg`,`760 mmHg`,`Gasometría arterial y presión arterial`],[`Torr`,`torr`,`760 torr`,`Presión de vacío en reactores químicos`],[`Kilopascal`,`kPa`,`101,325 kPa`,`Sistema Internacional de Unidades (SI)`],[`Libras por pulgada²`,`psi`,`14,7 psi`,`Manómetros de cilindros de O₂ medicinal`]]},keyPoints:[`Los 5 postulados: partículas puntuales, sin atracción, colisiones elásticas, energía cinética ∝ T (K)`,`Variables de estado: Presión (P), Volumen (V), Temperatura (T en Kelvin) y Moles (n)`,`Barometría: 1 atm = 760 mmHg = 760 torr = 101,325 kPa = 14,7 psi`,`Efecto de la altitud: En Cuenca (2550 m s.n.m.) Patm cae a ~560 mmHg`],keyFormulas:[`Ec = (3/2) · k · T  (Directamente proporcional a T en Kelvin)`,`P = Fuerza / Área  (Colisiones elásticas por segundo)`,`T(K) = °C + 273,15`],simulationType:`kinetic-theory`},{id:2,title:`Módulo 2.2: Leyes Individuales de los Gases`,subtitle:`Boyle (Isotérmica), Charles (Isobárica) y Gay-Lussac (Isocórica) en Fisiología`,timeRangeFormatted:`03:30 - 07:00`,startSeconds:210,durationSeconds:210,cameraShot:`[PLANO MEDIO] Demostración con Pistón Hidráulico Transparente`,actionDescription:`Aquila manipula un pistón hidráulico transparente con manómetro adjunto, balón de expansión térmica y cilindro rígido sellado.`,speechSegments:[{id:`2-2-1`,speaker:`AQUILA`,text:`Analicemos las leyes experimentales en sistemas cerrados donde la masa permanece constante. Primera: Ley de Boyle, proceso isotérmico a temperatura constante. El volumen de un gas es inversamente proporcional a la presión ejercida sobre él: P1 por V1 es igual a P2 por V2.`,actionNote:`Comprime el émbolo del pistón; la aguja del manómetro asciende velozmente.`,timestampStart:0,duration:21},{id:`2-2-2`,speaker:`AQUILA`,text:`Esta ley explica la mecánica respiratoria humana: Durante la inspiración, el diafragma se contrae y desciende aumentando el volumen torácico; la presión intrapulmonar cae por debajo de la atmosférica y el aire entra. En la espiración, el tórax se relaja, reduce su volumen y eleva la presión expulsando el aire.`,actionNote:`Muestra la animación del diafragma y la caja torácica.`,timestampStart:21,duration:22},{id:`2-2-3`,speaker:`AQUILA`,text:`Segunda: Ley de Charles, proceso isobárico a presión constante. El volumen de un gas es directamente proporcional a su temperatura Kelvin: V1 sobre T1 es igual a V2 sobre T2. Al inhalar 500 mililitros de aire a 20 grados Celsius, se calienta a 37 grados corporales expandiéndose dentro de los alvéolos.`,actionNote:`Enciende el quemador virtual; el balón se expande suavemente.`,timestampStart:43,duration:22},{id:`2-2-4`,speaker:`AQUILA`,text:`Tercera: Ley de Gay-Lussac, proceso isocórico a volumen constante. En un tanque rígido, la presión es directamente proporcional a la temperatura Kelvin: P1 sobre T1 es igual a P2 sobre T2. ¡Advertencia médica: los cilindros rígidos de oxígeno jamás deben exponerse al fuego, pues la presión se dispara provocando riesgo de explosión!`,actionNote:`Golpea el cilindro de acero señalando la válvula de sobrepresión.`,timestampStart:65,duration:23}],keyPoints:[`Ley de Boyle: P₁ · V₁ = P₂ · V₂ (T = const) — Mecánica del diafragma en ventilación`,`Ley de Charles: V₁ / T₁ = V₂ / T₂ (P = const) — Calentamiento del aire inspirado a 37 °C`,`Ley de Gay-Lussac: P₁ / T₁ = P₂ / T₂ (V = const) — Seguridad y sobrepresión en cilindros de O₂`,`Siempre transformar las temperaturas a la escala absoluta Kelvin`],keyFormulas:[`P₁ · V₁ = P₂ · V₂  (Isotérmico, T constante)`,`V₁ / T₁ = V₂ / T₂  (Isobárico, P constante)`,`P₁ / T₁ = P₂ / T₂  (Isocórico, V constante)`],simulationType:`gas-laws`},{id:3,title:`Módulo 2.3: Volumen Molar, Ley de Avogadro y Ley Combinada`,subtitle:`Condiciones Normales de Presión y Temperatura (CNPT) y Relación Molar`,timeRangeFormatted:`07:00 - 10:30`,startSeconds:420,durationSeconds:210,cameraShot:`[PLANO AMERICANO] Pizarra con Deducciones Matemáticas`,actionDescription:`Aquila agrupa las tres ecuaciones en una sola ley combinada e introduce recipientes con volúmenes molares estandarizados.`,speechSegments:[{id:`2-3-1`,speaker:`AQUILA`,text:`Cuando combinamos los principios de Boyle, Charles y Gay-Lussac en sistemas donde la masa no cambia, obtenemos la Ley Combinada de los Gases: P1 por V1 sobre T1 es igual a P2 por V2 sobre T2. Esta relación nos permite predecir el estado final cuando varían simultáneamente presión, volumen y temperatura.`,actionNote:`Escribe la fórmula unificada en la pizarra luminosa.`,timestampStart:0,duration:22},{id:`2-3-2`,speaker:`AQUILA`,text:`¿Qué sucede si introducimos más moléculas? A medida que inflamos un balón de reanimación, el volumen aumenta porque añadimos más moles. La Ley de Avogadro establece que, a presión y temperatura constantes, el volumen de un gas es directamente proporcional al número de moles: V1 sobre n1 es igual a V2 sobre n2.`,actionNote:`Muestra un ambú de ventilación manual inflando una cámara.`,timestampStart:22,duration:21},{id:`2-3-3`,speaker:`AQUILA`,text:`Para estandarizar mediciones biomédicas definimos las Condiciones Normales de Presión y Temperatura, CNPT: 0 grados Celsius, o 273,15 Kelvin, y una atmósfera de presión, 760 milímetros de mercurio. En CNPT, un mol de cualquier gas ideal ocupa exactamente 22,4 litros de volumen molar.`,actionNote:`Resalta el cubo de 22,4 Litros en pantalla.`,timestampStart:43,duration:23}],keyPoints:[`Ley Combinada: (P₁ · V₁) / T₁ = (P₂ · V₂) / T₂ para masa gaseosa constante`,`Ley de Avogadro: V₁ / n₁ = V₂ / n₂ (El volumen es directamente proporcional a los moles)`,`CNPT: T = 0 °C (273,15 K) y P = 1,0 atm (760 mmHg)`,`Volumen molar en CNPT: 1 mol = 22,4 Litros de cualquier gas ideal`],keyFormulas:[`(P₁ · V₁) / T₁ = (P₂ · V₂) / T₂`,`V₁ / n₁ = V₂ / n₂  (A P y T constantes)`,`1 mol gas (CNPT) = 22,4 L`],simulationType:`combined-gas-law`},{id:4,title:`Módulo 2.4: Ecuación General del Gas Ideal (PV = nRT)`,subtitle:`Deducción de la Constante Universal R, Masa Molar y Densidad`,timeRangeFormatted:`10:30 - 14:00`,startSeconds:630,durationSeconds:210,cameraShot:`[PLANO DETALLE] Deducción Matemática en Pantalla Holográfica`,actionDescription:`Aquila despeja algebraicamente la constante universal de los gases ideales e ilustra el cálculo con un tanque hospitalario de oxígeno.`,speechSegments:[{id:`2-4-1`,speaker:`AQUILA`,text:`Al integrar la Ley Combinada con el principio de Avogadro obtenemos la ecuación más importante de la fisicoquímica gaseosa: la Ecuación General de Estado del Gas Ideal: P por V es igual a n por R por T.`,actionNote:`Ilumina la ecuación maestra en dorado.`,timestampStart:0,duration:16},{id:`2-4-2`,speaker:`AQUILA`,text:`Deducción del valor de R: Tomando un mol de gas en CNPT que ocupa 22,414 litros a una atmósfera y 273,15 Kelvin, despejamos R: una atmósfera por 22,414 litros dividido para un mol por 273,15 Kelvin. El resultado es 0,08206 litros atmósfera sobre mol Kelvin.`,actionNote:`Desarrolla paso a paso la división algebraica.`,timestampStart:16,duration:24},{id:`2-4-3`,speaker:`AQUILA`,text:`Recuerden que para utilizar R igual a 0,082, la presión debe estar estrictamente en atmósferas, el volumen en litros, la cantidad en moles y la temperatura en Kelvin. Como n es masa sobre masa molar, podemos despejar la densidad o la masa molar de cualquier anestésico o gas desconocido.`,actionNote:`Apunta a la fórmula extendida P · V = (m / MM) · R · T.`,timestampStart:40,duration:22}],keyPoints:[`Ecuación general de estado: P · V = n · R · T`,`Constante universal: R = 0,08206 L·atm / (mol·K) = 8,314 J / (mol·K)`,`Condición de unidades: P en atm, V en Litros, n en moles, T en Kelvin`,`Aplicación: Cálculo de densidad (d = P·MM / RT) y masa molar (MM = m·RT / PV)`],keyFormulas:[`P · V = n · R · T`,`R = (1 atm · 22,414 L) / (1 mol · 273,15 K) = 0,08206 L·atm/(mol·K)`,`P · V = (m / MM) · R · T  ⇒  MM = (m · R · T) / (P · V)`],simulationType:`ideal-gas-derivation`},{id:5,title:`Módulo 2.5: Mezclas Gaseosas y Difusión Molecular`,subtitle:`Ley de Dalton (Presiones Parciales) y Ley de Graham (Difusión y Efusión)`,timeRangeFormatted:`14:00 - 17:30`,startSeconds:840,durationSeconds:210,cameraShot:`[PLANO MEDIO] Tanques de Mezclas Gaseosas y Membrana de Difusión`,actionDescription:`Aquila conecta varios cilindros de gases a una cámara común y demuestra la carrera de difusión molecular de Graham.`,speechSegments:[{id:`2-5-1`,speaker:`AQUILA`,text:`En el organismo humano y en la atmósfera nunca trabajamos con gases puros, sino con mezclas complejas. Para entender su comportamiento aplicamos dos leyes fundamentales.`,actionNote:`Muestra un analizador multigas conectado a tanques de nitrógeno, oxígeno y dióxido de carbono.`,timestampStart:0,duration:13},{id:`2-5-2`,speaker:`AQUILA`,text:`Ley de Dalton de las Presiones Parciales: En una mezcla de gases que no reaccionan entre sí, cada gas ejerce una presión parcial equivalente a la que ejercería si ocupara por sí solo todo el volumen. La presión total es la suma directa de las presiones parciales.`,actionNote:`Abre las válvulas y suma en la pantalla: P_total = P_N2 + P_O2 + P_CO2 + P_H2O.`,timestampStart:13,duration:22},{id:`2-5-3`,speaker:`AQUILA`,text:`Además, la presión parcial es su fracción molar por la presión total. Y la Ley de Graham de Difusión: a la misma temperatura, las velocidades de difusión de dos gases son inversamente proporcionales a la raíz cuadrada de sus masas molares. El oxígeno, con masa molar de 32, difunde 1,17 veces más rápido en fase gaseosa que el dióxido de carbono de masa molar 44.`,actionNote:`Inicia la carrera molecular virtual en el tubo transparente.`,timestampStart:35,duration:25}],keyPoints:[`Ley de Dalton: P_total = P₁ + P₂ + P₃ + ... + Pₙ`,`Presión parcial: Pᵢ = Xᵢ · P_total (donde Xᵢ = nᵢ / n_total es la fracción molar)`,`Ley de Graham: v₁ / v₂ = √(MM₂ / MM₁)`,`A menor masa molar, mayor velocidad de difusión molecular en fase gaseosa`],keyFormulas:[`P_total = ∑ Pᵢ = P_N₂ + P_O₂ + P_CO₂ + P_H₂O`,`Pᵢ = Xᵢ · P_total  (Xᵢ = nᵢ / n_total)`,`v₁ / v₂ = √(MM₂ / MM₁)`],simulationType:`gas-mixtures-diffusion`},{id:6,title:`Módulo 2.6: Fisiología Respiratoria: Gradientes y Hematosis`,subtitle:`Intercambio Gaseoso Alvéolo-Capilar, PO2 / PCO2 y Efecto de Altitud en Cuenca`,timeRangeFormatted:`17:30 - 21:00`,startSeconds:1050,durationSeconds:210,cameraShot:`[PLANO GENERAL] Diagrama Anatómico 3D de Alvéolo y Capilar Sanguíneo`,actionDescription:`Aquila señala los gradientes de presiones parciales a lo largo de la membrana alvéolo-capilar con eritrocitos circulantes.`,speechSegments:[{id:`2-6-1`,speaker:`AQUILA`,text:`Llevemos la fisicoquímica al cuerpo humano. La respiración y la hematosis o intercambio gaseoso pulmonar están gobernadas estrictamente por gradientes de difusión de presión parcial: un gas siempre difunde desde donde su presión parcial es mayor hacia donde es menor.`,actionNote:`Apunta con el puntero láser hacia la membrana alvéolo-capilar.`,timestampStart:0,duration:20},{id:`2-6-2`,speaker:`AQUILA`,text:`Mecánica del oxígeno: El aire alveolar posee una PO2 de 100 milímetros de mercurio, mientras la sangre venosa que llega al capilar tiene 40 milímetros de mercurio. ¡Este gradiente neto de 60 milímetros de mercurio impulsa con rapidez el oxígeno hacia la sangre, oxigenándola a 100 milímetros de mercurio!`,actionNote:`Muestra las flechas de difusión del O2 oxigenando la hemoglobina.`,timestampStart:20,duration:22},{id:`2-6-3`,speaker:`AQUILA`,text:`Mecánica del dióxido de carbono: La sangre venosa llega con PCO2 de 46 milímetros de mercurio y el alvéolo tiene 40 milímetros de mercurio. Un gradiente de solo 6 milímetros de mercurio es suficiente para expulsarlo debido a su enorme solubilidad biológica.`,actionNote:`Destaca la salida del CO2 al espacio alveolar.`,timestampStart:42,duration:19},{id:`2-6-4`,speaker:`AQUILA`,text:`Caso clínico en altitud: En nuestra ciudad de Cuenca a 2550 metros sobre el nivel del mar, la presión atmosférica promedio es de 560 milímetros de mercurio. Con 21% de oxígeno en el aire ambiente, la presión inspirada de oxígeno cae de 160 a 117,6 milímetros de mercurio, desencadenando hiperventilación compensatoria.`,actionNote:`Proyecta los datos de gasometría en Cuenca comparada con el nivel del mar.`,timestampStart:61,duration:23}],tableData:{headers:[`Gas`,`Aire Inspirado Seco`,`Aire Alveolar`,`Sangre Desoxigenada (Venosa)`,`Sangre Oxigenada (Arterial)`,`Tejidos Corporales`],rows:[[`Nitrógeno (N₂)`,`594,0 mmHg`,`573,0 mmHg`,`573,0 mmHg`,`573,0 mmHg`,`573,0 mmHg`],[`Oxígeno (O₂)`,`160,0 mmHg`,`100,0 mmHg`,`40,0 mmHg`,`100,0 mmHg`,`≤ 30,0 mmHg`],[`Dióxido de Carbono (CO₂)`,`0,3 mmHg`,`40,0 mmHg`,`46,0 mmHg`,`40,0 mmHg`,`≥ 50,0 mmHg`],[`Vapor de Agua (H₂O)`,`5,7 mmHg`,`47,0 mmHg`,`47,0 mmHg`,`47,0 mmHg`,`47,0 mmHg`],[`Presión Total`,`760,0 mmHg`,`760,0 mmHg`,`—`,`—`,`—`]]},keyPoints:[`Hematosis pasiva guiada por gradiente de presión parcial`,`Gradiente O₂: PO₂ alveolar (100 mmHg) - venosa (40 mmHg) = Δ 60 mmHg hacia el capilar`,`Gradiente CO₂: PCO₂ venosa (46 mmHg) - alveolar (40 mmHg) = Δ 6 mmHg hacia el alvéolo`,`Efecto Cuenca (2550 m): Patm 560 mmHg ⇒ PiO₂ = 117,6 mmHg (hipoxia relativa)`],keyFormulas:[`ΔPO₂ = PO₂ (alvéolo) - PO₂ (capilar venoso) = 100 - 40 = 60 mmHg`,`ΔPCO₂ = PCO₂ (capilar venoso) - PCO₂ (alvéolo) = 46 - 40 = 6 mmHg`,`PiO₂ = Patm · FiO₂  (En Cuenca: 560 mmHg · 0,21 = 117,6 mmHg)`],simulationType:`alveolar-physiology`},{id:7,title:`Módulo 2.7: Transporte de Gases Respiratorios en Sangre`,subtitle:`Hemoglobina, Curva de Disociación (Efecto Bohr) y Transporte de O2 y CO2`,timeRangeFormatted:`21:00 - 24:00`,startSeconds:1260,durationSeconds:180,cameraShot:`[PLANO DETALLE] Vista Microscópica de Eritrocito y Curva de Hemoglobina`,actionDescription:`Aquila proyecta la curva sigmoidea de saturación de la hemoglobina y muestra los desplazamientos del Efecto Bohr con pH y temperatura.`,speechSegments:[{id:`2-7-1`,speaker:`AQUILA`,text:`Una vez atravesada la membrana alvéolo-capilar, los gases deben ser transportados eficientemente en la sangre. El oxígeno viaja por dos vías: del 98 al 99 por ciento unido a la hemoglobina formando oxihemoglobina, y apenas del 1 al 2 por ciento disuelto en el plasma debido a su baja solubilidad acuosa.`,actionNote:`Muestra la molécula de hemoglobina tetramérica captando cuatro moléculas de O2.`,timestampStart:0,duration:22},{id:`2-7-2`,speaker:`AQUILA`,text:`El dióxido de carbono producido por el metabolismo celular se transporta en tres formas: 70 por ciento como ion bicarbonato en el plasma mediante la acción de la enzima anhidrasa carbónica en el eritrocito; de 20 a 25 por ciento unido a los grupos amino de la hemoglobina como carbaminohemoglobina; y de 5 a 10 por ciento disuelto en plasma.`,actionNote:`Ilumina la reacción de la anhidrasa carbónica: CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3-.`,timestampStart:22,duration:25},{id:`2-7-3`,speaker:`AQUILA`,text:`La curva de disociación de la hemoglobina tiene forma sigmoidea por cooperatividad. El Efecto Bohr demuestra que una disminución del pH ácido o un aumento de temperatura y PCO2 desplaza la curva a la derecha, facilitando la entrega de oxígeno a los tejidos metabólicamente activos.`,actionNote:`Desplaza la curva a la derecha mostrando la liberación tisular de O2.`,timestampStart:47,duration:22},{id:`2-7-4`,speaker:`AQUILA`,text:`¡Felicitaciones por completar el Bloque 2! Resuelvan ahora el cuestionario integral acumulativo. ¡Confíen en su talento y vuelen tan alto como se lo propongan! #SomosÁguilasRojas.`,actionNote:`Cierra la cátedra con pose académica universitaria de triunfo.`,timestampStart:69,duration:18}],tableData:{headers:[`Gas`,`Forma de Transporte Sanguíneo`,`Porcentaje Aproximado`,`Mecanismo Bioquímico`],rows:[[`Oxígeno (O₂)`,`Oxihemoglobina (HbO₂)`,`98,0% - 99,0%`,`Unión coordinada al Fe²⁺ en grupos hemo`],[`Oxígeno (O₂)`,`Disuelto en plasma`,`1,0% - 2,0%`,`Ley de Henry en fase acuosa plasmática`],[`Dióxido de Carbono (CO₂)`,`Ión Bicarbonato (HCO₃⁻)`,`70,0%`,`Catálisis por anhidrasa carbónica`],[`Dióxido de Carbono (CO₂)`,`Carbaminohemoglobina`,`20,0% - 25,0%`,`Unión a grupos amino terminales de la globina`],[`Dióxido de Carbono (CO₂)`,`Disuelto en plasma`,`5,0% - 10,0%`,`Mayor solubilidad que el O₂`]]},keyPoints:[`O₂: 98,5% unido a hemoglobina, 1,5% disuelto físicamente en plasma`,`CO₂: 70% como bicarbonato (HCO₃⁻) con anhidrasa carbónica, 23% carbaminohemoglobina, 7% disuelto`,`Curva de disociación sigmoidea: saturación vs PO₂`,`Efecto Bohr: acidosis (↓pH), ↑T y ↑PCO₂ desplazan la curva a la derecha (mayor liberación tisular de O₂)`],keyFormulas:[`CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻  (Anhidrasa Carbónica)`,`Hb + 4 O₂ ⇌ Hb(O₂)₄  (Cooperatividad alostérica)`,`Efecto Bohr: Desplazamiento a la derecha por ↓pH, ↑PCO₂, ↑Temperatura, ↑2,3-DPG`],simulationType:`gas-transport-hb`}]},{id:`bloque-3-organica-biomoleculas`,blockNumber:3,dates:`24-11-2026 al 22-01-2027`,title:`Bloque 3: Química Orgánica y Biomoléculas`,shortTitle:`Bloque 3: Orgánica & Biomoléculas`,badge:`Bloque 3 (24-11 al 22-01)`,category:`Bioquímica Estructural y Biología Celular`,academicLevel:`Primer Ciclo de Medicina y Ciencias de la Salud • Código MBAS04`,presenter:`Profesor Aguilar (Mascota Universitaria)`,presenterDesc:`Águila antropomórfica con bata médica, gafas de protección al cuello y puntero analítico molecular.`,scenery:`Laboratorio de Bioquímica y Biología Celular con proyectores moleculares 3D`,totalDurationFormatted:`24:00 min`,practicalLabs:[`Práctica 7: Medicina ancestral del Ecuador - Costa/Sierra (2 pts)`,`Práctica 8: Medicina ancestral del Ecuador - Amazonía/Insular (2 pts)`],evaluations:[`Investigación bibliográfica médica (10 pts)`,`Proyecto de caso clínico aplicado (5 pts)`,`Prueba objetiva Bloque 3 (5 pts)`,`Evaluación Final Acumulativa (20 pts)`],supportDocuments:[`QUÍMICA ORGÁNICA Y BIOMOLÉCULAS SEPTIEMBRE 2026 - FEBRERO 2027.pdf`],scenes:[{id:1,title:`Módulo 3.1: Origen de la Química Orgánica, Hibridación y Grupos Funcionales`,subtitle:`Síntesis de Wöhler (1828), orbitales sp³-sp²-sp y análisis de fármacos (Aspirina, Paracetamol, Ibuprofeno)`,timeRangeFormatted:`00:00 - 02:40`,startSeconds:0,durationSeconds:160,cameraShot:`[PLANO MEDIO DE AQUILA EN EL ESTRADO CON MODELO TETRAÉDRICO]`,actionDescription:`Aquila ajusta su bata médica con elegancia, sostiene un modelo molecular tridimensional en su garra y activa el proyector holográfico.`,speechSegments:[{id:`bio-1-1`,speaker:`PROF. AGUILAR`,text:`¡Atención, futuros médicos! Soy el profesor Aguilar. Hoy nos adentraremos en el pilar fundamental de la bioquímica: la estructura y función de las biomoléculas.`,actionNote:`Ajusta su bata de laboratorio y saluda con entusiasmo académico.`,timestampStart:0,duration:12},{id:`bio-1-2`,speaker:`AQUILA`,text:`Históricamente, en el siglo diecinueve se creía que los compuestos orgánicos requerían una "fuerza vital" exclusiva de los seres vivos. Sin embargo, en 1828, Friedrich Wöhler derrumbó esta doctrina al sintetizar urea —un producto del metabolismo proteico— calentando el compuesto inorgánico cianato de amonio.`,actionNote:`Sostiene un modelo de urea y señala la reacción en la pizarra sintética.`,timestampStart:12,duration:25},{id:`bio-1-3`,speaker:`AQUILA`,text:`La química orgánica es esencialmente la química del átomo de carbono. Con su configuración un-ese-dos, dos-ese-dos, dos-pe-dos, el carbono promueve un electrón para hibridar sus orbitales en sp-tres tetraédrico a ciento nueve punto cinco grados, sp-dos trigonal plano a ciento veinte grados, o sp lineal a ciento ochenta grados, permitiendo concatenarse indefinidamente.`,actionNote:`Activa la proyección 3D de las geometrías de hibridación orbital.`,timestampStart:37,duration:28},{id:`bio-1-4`,speaker:`AQUILA`,text:`En medicina, reconocer las familias funcionales es vital: desde el grupo éster y ácido carboxílico de la aspirina que acetila la ciclooxigenasa, la amida y fenol del paracetamol, hasta los tioles de la cisteína que forman puentes disulfuro y neutralizan tóxicos mediante el glutatión.`,actionNote:`Muestra las estructuras farmacológicas en el visor molecular tridimensional.`,timestampStart:65,duration:26}],keyFormulas:[`NH₄OCN (Cianato de amonio) + Calor → CO(NH₂)₂ (Urea)`,`Hibridación sp³: Tetraédrica (109.5°) • sp²: Trigonal Plana (120°) • sp: Lineal (180°)`,`Carbono Tetravalente: Z = 6 (1s² 2s² 2p² → 4 orbitales híbridos equivalentes)`],keyPoints:[`1. Síntesis de Wöhler (1828): Demolición de la doctrina del vitalismo (Berzelius).`,`2. Geometría Orbital: Sp³ en enlaces sencillos C—C, sp² en dobles enlaces y sp en triples.`,`3. Farmacología Funcional: Éster en aspirina, amida en paracetamol, ácido carboxílico en ibuprofeno.`,`4. Relevancia Clínica: El nitrógeno ureico (BUN) evalúa directamente la función de filtración renal.`],simulationType:`carbon-organic-origin`},{id:2,title:`Módulo 3.2: Carbohidratos: Monosacáridos y Estereoquímica`,subtitle:`Proyecciones de Fischer, isomería D/L, epímeros en C-4 y C-2, y galactosemia`,timeRangeFormatted:`02:40 - 05:20`,startSeconds:160,durationSeconds:160,cameraShot:`[PLANO GENERAL EN LA PIZARRA CON ESTRUCTURAS FISCHER]`,actionDescription:`Aquila proyecta las fórmulas de Fischer comparativas de D-Glucosa, D-Galactosa y D-Manosa, resaltando los carbonos quirales.`,speechSegments:[{id:`bio-2-1`,speaker:`AQUILA`,text:`Los hidratos de carbono, formados por carbono, hidrógeno y oxígeno, aportan cuatro kilocalorías por gramo, equivalentes a diecisiete kilojulios por gramo, como combustible de utilización celular inmediata.`,actionNote:`Muestra la fórmula general de los carbohidratos.`,timestampStart:0,duration:16},{id:`bio-2-2`,speaker:`AQUILA`,text:`Los monosacáridos son polihidroxialdehídos o polihidroxiacetonas. En las proyecciones de Fischer, la serie D o L se define por la orientación del hidroxilo en el carbono asimétrico más alejado del carbonilo: a la derecha es D y a la izquierda es L.`,actionNote:`Señala el C-5 en aldohexosas con su puntero láser.`,timestampStart:16,duration:22},{id:`bio-2-3`,speaker:`AQUILA`,text:`¡Memoricen bien los epímeros! La D-galactosa difiere de la D-glucosa únicamente en el carbono cuatro, y la D-manosa difiere en el carbono dos. Una inversión espacial minúscula que cambia por completo su ruta metabólica.`,actionNote:`Compara detalladamente los estereocentros de D-glucosa y D-galactosa.`,timestampStart:38,duration:22},{id:`bio-2-4`,speaker:`AQUILA`,text:`La deficiencia de la enzima galactosa-uno-fosfato uridiltransferasa provoca galactosemia clásica. La galactosa no metabolizada se reduce a galactitol por la aldosa reductasa en el cristalino ocular, desencadenando cataratas tempranas, cirrosis hepática y retraso mental.`,actionNote:`Expresión enfática apuntando al cuadro clínico neonatal.`,timestampStart:60,duration:26}],keyFormulas:[`Fórmula General Hidratos de Carbono: Cₙ(H₂O)ₙ (ó CₙH₂ₙOₙ)`,`Rendimiento Energético Glucídico: 4 kcal/g = 17 kJ/g`,`Epímero C-4: D-Glucosa vs D-Galactosa • Epímero C-2: D-Glucosa vs D-Manosa`],keyPoints:[`1. Serie D o L: Referenciada al carbono asimétrico distal (C-5 en hexosas).`,`2. Epímeros Clínicos: D-galactosa (C-4) y D-manosa (C-2).`,`3. Galactosemia Clásica: Bloqueo en la enzima GALT con acúmulo tóxico de galactitol.`,`4. Tratamiento Pediátrico: Eliminación absoluta de lactosa y galactosa en la dieta infantil.`],simulationType:`carbohydrates-stereochem`},{id:3,title:`Módulo 3.2: Ciclación de Haworth, Disacáridos y Polisacáridos`,subtitle:`Formas piranosas/furanosas, anómeros alfa/beta, lactosa, glucógeno, celulosa e intolerancia`,timeRangeFormatted:`05:20 - 08:00`,startSeconds:320,durationSeconds:160,cameraShot:`[PLANO MEDIO DE AQUILA MOSTRANDO CICLACIÓN HEMIACETÁLICA]`,actionDescription:`Aquila interactúa con la pantalla animando la ciclación de Fischer a Haworth y el enlace beta-1,4 de la lactosa.`,speechSegments:[{id:`bio-3-1`,speaker:`AQUILA`,text:`En disolución acuosa, más del noventa y nueve por ciento de las aldohexosas ciclan formando hemiacetales intramoleculares. En las fórmulas de Haworth, el anómero alfa orienta su hidroxilo hacia abajo del plano del anillo, y el beta hacia arriba.`,actionNote:`Muestra la ciclación de Fischer a Haworth de la glucopiranosa.`,timestampStart:0,duration:20},{id:`bio-3-2`,speaker:`AQUILA`,text:`Al condensarse dos monosacáridos con pérdida de agua, se genera el enlace glicosídico. La maltosa posee enlace alfa-uno-cuatro, la sacarosa alfa-uno-beta-dos entre glucosa y fructosa, y la lactosa enlace beta-uno-cuatro entre galactosa y glucosa.`,actionNote:`Simula el enlace glicosídico uniendo dos anillos moleculares.`,timestampStart:20,duration:22},{id:`bio-3-3`,speaker:`AQUILA`,text:`El déficit de lactasa en las microvellosidades intestinales impide degradar la lactosa. El azúcar intacto genera un gradiente osmótico que atrae agua a la luz intestinal y es fermentado por bacterias del colon produciendo gas metano, diarrea ácida y dolor cólico.`,actionNote:`Apunta a la fisiopatología osmótica en el enterocito.`,timestampStart:42,duration:24},{id:`bio-3-4`,speaker:`AQUILA`,text:`Entre los polisacáridos: el glucógeno almacena energía en hígado y músculo con ramificaciones alfa-uno-seis cada ocho a doce monómeros, mientras la celulosa vegetal, con enlaces beta-uno-cuatro que el humano no puede hidrolizar, constituye la fibra dietética insoluble.`,actionNote:`Compara la arquitectura de ramificación del glucógeno frente a la celulosa.`,timestampStart:66,duration:25}],keyFormulas:[`Sacarosa: α-D-Glucopiranosil-(1→2)-β-D-Fructofuranósido (Azúcar no reductor)`,`Lactosa: β-D-Galactopiranosil-(1→4)-D-Glucopiranosa`,`Glucógeno: Enlaces principales α(1→4) y ramificaciones α(1→6) cada 8-12 residuos`,`Celulosa: Enlaces β(1→4) lineales e indigeribles por enzimas humanas`],keyPoints:[`1. Fórmulas de Haworth: Piranosas (anillo de 6) y furanosas (anillo de 5).`,`2. Anómeros α y β: Determinados por la posición del OH anomérico en C-1.`,`3. Intolerancia a la Lactosa: Déficit enzimático en ribete en cepillo con diarrea osmótica.`,`4. Glucógeno vs Celulosa: Disponibilidad rápida de glucosa vs soporte estructural rígido.`],simulationType:`disaccharides-polysaccharides`},{id:4,title:`Módulo 3.3: Lípidos, Ácidos Grasos y Triacilgliceroles`,subtitle:`Ácidos grasos saturados vs cis-insaturados, 9 kcal/g, lipasa y saponificación`,timeRangeFormatted:`08:00 - 10:40`,startSeconds:480,durationSeconds:160,cameraShot:`[PLANO GENERAL EN EL ÁREA DE METABOLISMO LIPÍDICO]`,actionDescription:`Aquila se desplaza al sector metabólico y analiza las colas hidrocarbonadas apolares y los enlaces éster de los triglicéridos.`,speechSegments:[{id:`bio-4-1`,speaker:`AQUILA`,text:`Pasemos a los lípidos: biomoléculas insolubles en agua debido al predominio de enlaces no polares carbono-hidrógeno, pero solubles en disolventes apolares orgánicos como el cloroformo o éter.`,actionNote:`Muestra un matraz con separación bifásica agua-lípido.`,timestampStart:0,duration:16},{id:`bio-4-2`,speaker:`AQUILA`,text:`Los ácidos grasos saturados poseen cadenas lineales rígidas que empacan fuertemente, originando grasas sólidas a temperatura ambiente. En cambio, los insaturados con dobles enlaces en configuración cis introducen acodamientos de treinta grados que impiden el empaque, manteniéndose líquidos como aceites.`,actionNote:`Contrasta la geometría recta del ácido palmítico con el acodamiento del ácido oleico.`,timestampStart:16,duration:25},{id:`bio-4-3`,speaker:`AQUILA`,text:`Los triacilgliceroles son triésteres de glicerol con tres ácidos grasos. Al estar en un estado químico mucho más reducido que los carbohidratos y almacenarse anhidros sin agua de hidratación, aportan nueve kilocalorías por gramo, equivalentes a treinta y ocho kilojulios por gramo.`,actionNote:`Enfatiza la densidad calórica de 9 kcal/g en el tejido adiposo.`,timestampStart:41,duration:26},{id:`bio-4-4`,speaker:`AQUILA`,text:`Fisiológicamente, la lipasa pancreática hidroliza los enlaces éster en el duodeno. Industrialmente, la saponificación con hidróxido de sodio o potasio genera glicerol y sales de ácidos grasos, los jabones.`,actionNote:`Explica la hidrólisis enzimática versus la saponificación alcalina.`,timestampStart:67,duration:22}],keyFormulas:[`Glicerol + 3 Ácidos Grasos ⇌ Triacilglicerol (Triglicérido) + 3 H₂O`,`Densidad Calórica Lipídica: 9 kcal/g = 38 kJ/g (Estado altamente reducido)`,`Saponificación: Triacilglicerol + 3 NaOH → Glicerol + 3 R-COO⁻ Na⁺ (Jabón)`],keyPoints:[`1. Doble Enlace Cis: Angulación de ~30° que disminuye el punto de fusión en membranas.`,`2. Alta Densidad Calórica: 9 kcal/g debido a su mayor grado de reducción e hidrofobicidad.`,`3. Lipólisis Duodenal: Acción combinada de sales biliares emulsionantes y lipasa pancreática.`,`4. Saponificación: Hidrólisis básica alcalina utilizada en la síntesis de jabones y emulsificantes.`],simulationType:`lipids-triglycerides`},{id:5,title:`Módulo 3.3: Lípidos Especializados, Surfactante, Esteroides y Vitaminas A, D, E, K`,subtitle:`DPPC en neumocitos tipo II, núcleo de esterano, lipoproteínas y deficiencias vitamínicas`,timeRangeFormatted:`10:40 - 13:20`,startSeconds:640,durationSeconds:160,cameraShot:`[PLANO AMERICANO - MOSTRANDO SURFACTANTE Y VITAMINAS LIPOSOLUBLES]`,actionDescription:`Aquila exhibe modelos de dipalmitoilfosfatidilcolina, el anillo tetracíclico de esterano y la matriz de vitaminas liposolubles.`,speechSegments:[{id:`bio-5-1`,speaker:`AQUILA`,text:`Entre los lípidos especializados, los fosfoglicéridos son anfipáticos con cabeza polar de fosfato y aminoalcohol, y dos colas apolares. La dipalmitoilfosfatidilcolina sintetizada por los neumocitos tipo dos constituye el surfactante pulmonar: reduce la tensión superficial y previene el colapso alveolar.`,actionNote:`Muestra un esquema alveolar con surfactante reduciendo la tensión superficial.`,timestampStart:0,duration:24},{id:`bio-5-2`,speaker:`AQUILA`,text:`En recién nacidos prematuros, la falta de surfactante produce la Enfermedad de Membrana Hialina. Se trata con instilación endotraqueal de surfactante y profilaxis materna antenatal con corticoides.`,actionNote:`Señala el cuadro radiológico del distrés respiratorio neonatal.`,timestampStart:24,duration:20},{id:`bio-5-3`,speaker:`AQUILA`,text:`Los esteroides contienen el núcleo de esterano de cuatro anillos fusionados. El colesterol es el esterol fundamental, precursor de hormonas esteroideas, cortisol, calcitriol y sales biliares, transportado en la sangre por lipoproteínas LDL aterogénicas y HDL protectoras.`,actionNote:`Rastrea los cuatro anillos del esterano y el transporte reverso en HDL.`,timestampStart:44,duration:24},{id:`bio-5-4`,speaker:`AQUILA`,text:`Por último, las vitaminas liposolubles A, D, E y K: la deficiencia de vitamina A causa ceguera nocturna y xeroftalmía; la de vitamina D causa raquitismo y osteomalacia; la de vitamina E genera anemia hemolítica; y la de vitamina K produce diátesis hemorrágica del recién nacido.`,actionNote:`Despliega la tabla clínica de síndromes carenciales de vitaminas liposolubles.`,timestampStart:68,duration:26}],keyFormulas:[`Surfactante Alveolar: Dipalmitoilfosfatidilcolina (DPPC) • Ley de Laplace: P = 2T / r`,`Núcleo de Esterano: Ciclopentanoperhidrofenantreno (3 anillos de 6C + 1 de 5C)`,`Vitaminas Liposolubles: A (Retinol), D (Calciferol), E (Tocoferol), K (Filoquinona)`],keyPoints:[`1. Surfactante Pulmonar: Evita el colapso alveolar en espiración (Membrana Hialina).`,`2. Colesterol y Esteroides: 27 carbonos; base de hormonas sexuales, bilis y vitamina D₃.`,`3. Lipoproteínas: LDL aterogénica (depósito subendotelial) vs HDL protectora (transporte reverso).`,`4. Vitaminas Liposolubles: Requieren sales biliares para su absorción intestinal micelar.`],simulationType:`specialized-lipids`},{id:6,title:`Módulo 3.4: Aminoácidos, Proteínas y Cinética Enzimática`,subtitle:`Zwitterión a pH 7.4, enlace peptídico planar, niveles estructurales y Michaelis-Menten`,timeRangeFormatted:`13:20 - 16:00`,startSeconds:800,durationSeconds:160,cameraShot:`[PLANO MEDIO DE AQUILA ANTE EL SIMULADOR DE CINÉTICA ENZIMÁTICA]`,actionDescription:`Aquila interactúa con el simulador de Michaelis-Menten, variando la concentración de sustrato y comparando inhibidores.`,speechSegments:[{id:`bio-6-1`,speaker:`AQUILA`,text:`Los aminoácidos poseen un carbono alfa quiral unido a un grupo amino, un carboxilo, un hidrógeno y una cadena lateral erre. A pH fisiológico de siete punto cuatro existen como zwitteriones dipolares con carga neta neutra en su punto isoeléctrico.`,actionNote:`Muestra la ionización del zwitterión.`,timestampStart:0,duration:20},{id:`bio-6-2`,speaker:`AQUILA`,text:`El enlace peptídico que une a los aminoácidos es un enlace amida covalente rígido y planar con un cuarenta por ciento de carácter de doble enlace por resonancia, lo que impide la libre rotación sobre el enlace carbono-nitrógeno.`,actionNote:`Señala la rigidez y coplanaridad del enlace peptídico.`,timestampStart:20,duration:21},{id:`bio-6-3`,speaker:`AQUILA`,text:`Las proteínas adoptan cuatro niveles estructurales: primaria, secundaria en alfa-hélice y lámina beta, terciaria estabilizada por puentes disulfuro e interacciones hidrofóbicas, y cuaternaria como el tetrámero de la hemoglobina.`,actionNote:`Despliega la jerarquía estructural proteica tridimensional.`,timestampStart:41,duration:22},{id:`bio-6-4`,speaker:`AQUILA`,text:`Las enzimas aceleran las reacciones reduciendo la energía de activación. Su cinética sigue el modelo de Michaelis-Menten: cuando la concentración de sustrato es igual a la Km, la velocidad es la mitad de la Vmax. Un inhibidor competitivo eleva la Km aparente sin alterar la Vmax, mientras que un no competitivo reduce la Vmax.`,actionNote:`Traza las curvas de inhibición enzimática en la pantalla interactiva.`,timestampStart:63,duration:27}],keyFormulas:[`Ecuación de Michaelis-Menten: V₀ = (V_max · [S]) / (K_m + [S])`,`Definición de K_m: Concentración de sustrato [S] donde V₀ = V_max / 2`,`Inhibición Competitiva: ↑ K_m aparente, V_max inalterada (superable con ↑ [S])`,`Inhibición No Competitiva: ↓ V_max, K_m inalterada (sitio alostérico)`],keyPoints:[`1. Estado Zwitteriónico: Ion dipolar dipolar neutro a pH fisiológico 7.4.`,`2. Enlace Peptídico: Enlace amida rígido, planar y con carácter parcial de doble enlace.`,`3. Jerarquía Estructural: 1° (secuencia), 2° (H-bonds), 3° (3D global), 4° (subunidades).`,`4. Cinética de Michaelis-Menten: Cuantificación de afinidad enzimática y dianas farmacológicas.`],simulationType:`proteins-enzymes-kinetics`},{id:7,title:`Módulo 3.4: La Membrana Celular: Modelo de Mosaico Fluido`,subtitle:`Bicapa lipídica de Singer y Nicolson, colesterol regulador térmico y glucocálix`,timeRangeFormatted:`16:00 - 18:40`,startSeconds:960,durationSeconds:160,cameraShot:`[PLANO GENERAL - ANIMACIÓN 3D INTERACTIVA DE LA BICAPA LIPÍDICA]`,actionDescription:`Aquila activa la simulación tridimensional de la bicapa fosfolipídica viva con proteínas en movimiento continuo.`,speechSegments:[{id:`bio-7-1`,speaker:`AQUILA`,text:`Todo este andamiaje químico converge en la frontera celular: la membrana plasmática. Formulada en mil novecientos setenta y dos por Singer y Nicolson, el modelo de mosaico fluido describe una doble capa dinámica y asimétrica de fosfoglicéridos.`,actionNote:`Señala la orientación termodinámica de las cabezas y colas.`,timestampStart:0,duration:21},{id:`bio-7-2`,speaker:`AQUILA`,text:`Los dobles enlaces cis de los ácidos grasos mantienen el estado líquido-cristalino a treinta y siete grados. Las proteínas integrales cruzan la bicapa como transportadores iónicos y receptores, mientras las proteínas periféricas se adosan para la transducción de señales.`,actionNote:`Muestra un canal de transporte transmembrana cruzando la bicapa.`,timestampStart:21,duration:22},{id:`bio-7-3`,speaker:`AQUILA`,text:`El colesterol actúa como un amortiguador térmico: a temperaturas elevadas restringe el movimiento de los lípidos para que la membrana no se desintegre, y a bajas temperaturas previene que los fosfolípidos cristalicen en gel.`,actionNote:`Destaca las moléculas de colesterol entre los fosfolípidos.`,timestampStart:43,duration:22},{id:`bio-7-4`,speaker:`AQUILA`,text:`En la cara externa celular, las cadenas de oligosacáridos forman el glucocálix, esencial para la adhesión tisular y el reconocimiento inmunitario de los grupos sanguíneos A, B y cero.`,actionNote:`Apunta a las antenas de carbohidratos del glucocálix.`,timestampStart:65,duration:21}],keyFormulas:[`Espesor Bicapa Lipídica: ~7.5 - 10 nm (Nanómetros)`,`Fracción de Colesterol en Membrana Animal: 20% - 25% del total lipídico`,`Termodinámica de Ensamblaje: Efecto hidrofóbico autoensamblante (ΔG < 0)`],keyPoints:[`1. Mosaico Fluido (Singer & Nicolson 1972): Bicapa lipídica fluida y asimétrica.`,`2. Colesterol como Amortiguador Térmico: Mantiene la fluidez homeostática a 37°C.`,`3. Proteínas de Membrana: Integrales transmembrana (canales, bombas) y periféricas.`,`4. Glucocálix: Reconocimiento celular, grupos sanguíneos ABO e histocompatibilidad.`],simulationType:`fluid-mosaic-membrane`},{id:8,title:`Ejercicios Numéricos Resueltos Paso a Paso`,subtitle:`Balance calórico de ración (4-4-9 kcal/g) y cálculo cinético de Michaelis-Menten`,timeRangeFormatted:`18:40 - 20:40`,startSeconds:1120,durationSeconds:120,cameraShot:`[PLANO MEDIO EN LA CALCULADORA BIOQUÍMICA INTEGRADA]`,actionDescription:`Aquila interactúa con la calculadora numérica resolviendo en vivo los problemas analíticos de nutrición y enzimología.`,speechSegments:[{id:`bio-8-1`,speaker:`AQUILA`,text:`¡Hora del cálculo cuantitativo riguroso! En nutrición médica, aplicamos los factores de Atwater: cuatro kilocalorías por gramo de carbohidratos, cuatro para proteínas y nueve para lípidos.`,actionNote:`Apunta a la fórmula de cálculo calórico en pantalla.`,timestampStart:0,duration:16},{id:`bio-8-2`,speaker:`AQUILA`,text:`En el Problema uno: ciento cincuenta gramos de glúcidos son seiscientas kilocalorías, sesenta gramos de proteínas doscientas cuarenta, y cuarenta gramos de lípidos trescientas sesenta, para un total de mil doscientas kilocalorías, con cincuenta por ciento, veinte por ciento y treinta por ciento respectivamente.`,actionNote:`Demuestra los pasos matemáticos y el gráfico de pastel calórico.`,timestampStart:16,duration:25},{id:`bio-8-3`,speaker:`AQUILA`,text:`En el Problema dos de Michaelis-Menten: con Vmax de cien y Km de dos milimolar, al ensayar con sustrato igual a Km obtenemos exactamente cincuenta micromoles por minuto, y a ocho milimolar alcanzamos ochenta micromoles por minuto.`,actionNote:`Resuelve la ecuación paso a paso con los valores numéricos.`,timestampStart:41,duration:24}],keyFormulas:[`Energía Total: E = (g Glúcidos × 4) + (g Proteínas × 4) + (g Lípidos × 9)`,`Equivalencia Energética: 1 kcal = 4.184 kJ (Kilojulios)`,`Michaelis-Menten: V₀ = (100 · [S]) / (2.0 + [S])`],keyPoints:[`1. Densidad Calórica: 4 kcal/g (glúcidos/proteínas) y 9 kcal/g (lípidos).`,`2. Distribución OMS Saludable: 50-60% carbohidratos, 10-20% proteínas, 20-30% grasas.`,`3. Punto de Saturación Media: [S] = Km determina V₀ = Vmax / 2.`,`4. Respuesta Asintótica: A concentraciones elevadas de sustrato, V₀ se aproxima a Vmax.`],simulationType:`biomolecules-solved-problems`},{id:9,title:`Desafío Clínico Interactivo: Caso de Galactosemia Neonatal`,subtitle:`Resolución diagnóstica interactiva del recién nacido con cataratas e ictericia`,timeRangeFormatted:`20:40 - 22:20`,startSeconds:1240,durationSeconds:100,cameraShot:`[PLANO MEDIO DE AQUILA CERRANDO EL EXPEDIENTE CLÍNICO]`,actionDescription:`Aquila analiza el historial neonatal de galactosemia clásica y guía al estudiante en la toma de decisiones terapéuticas.`,speechSegments:[{id:`bio-9-1`,speaker:`AQUILA`,text:`Atiendan a su paciente neonatal: un recién nacido alimentado con leche materna presenta ictericia, hepatomegalia, vómitos y opacidad de cristalinos por cataratas bilaterales. Se detecta sustancia reductora positiva en orina.`,actionNote:`Presenta los signos clínicos del lactante en el expediente.`,timestampStart:0,duration:18},{id:`bio-9-2`,speaker:`AQUILA`,text:`El diagnóstico es galactosemia clásica por deficiencia congénita de GALT. La lactosa materna se hidroliza en glucosa y galactosa; al no poder metabolizarse, la galactosa se acumula y se reduce a galactitol en el cristalino.`,actionNote:`Explica el defecto genético y la cataratogénesis osmótica por galactitol.`,timestampStart:18,duration:22},{id:`bio-9-3`,speaker:`AQUILA`,text:`La intervención inmediata salva la vida y previene secuelas neurocognitivas: suspensión total y definitiva de la lactancia materna y cambio a una fórmula especializada a base de proteína de soya libre de lactosa.`,actionNote:`Concluye con la indicación dietética de rescate pediátrico.`,timestampStart:40,duration:20}],keyFormulas:[`Enzima Afectada: Galactosa-1-fosfato uridiltransferasa (GALT)`,`Reacción Cataratogénica: Galactosa + NADPH + H⁺ ⇌ Galactitol + NADP⁺ (Aldosa Reductasa)`,`Disacárido Tóxico: Lactosa (β-D-Galactopiranosil-(1→4)-D-Glucosa)`],keyPoints:[`1. Fisiopatología: Acúmulo tisular de galactosa-1-fosfato y galactitol osmótico en el cristalino.`,`2. Triada Clínica Neonatal: Ictericia con hepatomegalia, fallo de medro y cataratas tempranas.`,`3. Diagnóstico Diferencial: Distinguir de intolerancia a la lactosa (la cual no produce cataratas).`,`4. Manejo Terapéutico: Dieta estricta libre de galactosa de por vida (fórmulas de soya o elementales).`],simulationType:`biomolecules-clinical-challenge`},{id:10,title:`Banco de Autoevaluación Integral y Examen del Bloqu
